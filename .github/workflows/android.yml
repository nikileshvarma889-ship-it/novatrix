# Builds the Reelwise Android app (APK + AAB) and publishes them as a GitHub Release.
# Runs on GitHub's Ubuntu runners, which include the Android SDK.
name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "reelwise/mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelwise/mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor and sync the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the project's release key." >> "$GITHUB_ENV"
          else
            # No secrets yet: sign with a one-off key so the APK installs.
            # Add the ANDROID_* secrets (see reelwise/docs/ANDROID.md) so updates install over earlier versions.
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias reelwise -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Reelwise, O=Reelwise, C=IN"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=reelwise" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with a temporary key (no release-key secrets configured). Uninstall before installing a build signed with a different key." >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: reelwise/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signatures
        working-directory: reelwise/mobile/android
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/reelwise.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/reelwise.aab
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: reelwise-android-${{ github.run_number }}
          path: reelwise/mobile/dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/reelwise.apk dist/reelwise.aab \
            --target "$GITHUB_SHA" \
            --title "Reelwise Android 1.0.${{ github.run_number }}" \
            --notes "Reelwise Android app. Install reelwise.apk on your phone; upload reelwise.aab to Google Play. ${SIGNING_NOTE}"
