# Self-hosted Reelwise on any Linux VPS with Docker, with automatic HTTPS from Caddy.
#   1. Point your domain's DNS A record at the server.
#   2. cp .env.example .env  and fill it in (APP_URL=https://your-domain, ENCRYPTION_KEY, keys...).
#   3. DOMAIN=your-domain POSTGRES_PASSWORD=<strong password> docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelwise
      POSTGRES_USER: reelwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelwise"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: all
      STORAGE_DIR: /data/storage
      DATABASE_URL: postgres://reelwise:${POSTGRES_PASSWORD}@db:5432/reelwise
    volumes: [appdata:/data]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN} --to app:3000
    volumes: [caddydata:/data]
    depends_on: [app]

volumes:
  pgdata:
  appdata:
  caddydata:
