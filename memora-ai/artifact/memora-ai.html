<style>
:root{--bg:245 246 251;--surface:255 255 255;--surface2:238 240 248;--border:222 225 238;--fg:17 20 39;--muted:88 94 122;--subtle:140 146 172;--brand:109 76 255;--brand2:37 140 255;--ok:16 160 110;--warn:204 130 10;--danger:222 60 80;--math:120 90 255;--phys:30 150 255;--chem:16 170 130}
html.dark{--bg:8 10 22;--surface:16 19 36;--surface2:23 27 48;--border:39 44 72;--fg:234 236 248;--muted:160 166 196;--subtle:112 118 150;--brand:139 108 255;--brand2:56 160 255;--ok:52 211 153;--warn:251 191 36;--danger:248 113 133;--math:160 132 255;--phys:86 178 255;--chem:52 211 170}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:rgb(var(--bg));color:rgb(var(--fg));font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(900px 500px at 90% -10%,rgb(var(--brand)/.12),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgb(var(--brand2)/.09),transparent 60%);background-attachment:fixed;overflow-x:clip}
.te,textarea,input{font-family:Inter,"Noto Sans Telugu",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:rgb(var(--brand))}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:236px;padding:14px 10px;border-right:1px solid rgb(var(--border)/.7);background:rgb(var(--surface)/.7);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:30}
.main{flex:1;min-width:0;margin-left:236px;padding:20px 28px 60px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-size:14px;letter-spacing:.14em}.brand small{display:block;font-size:9.5px;color:rgb(var(--subtle));white-space:nowrap;margin-top:3px}
.nav{overflow-y:auto;flex:1;min-height:0;margin-bottom:6px}.nav a{display:flex;align-items:center;gap:11px;padding:7px 11px;border-radius:12px;color:rgb(var(--muted));text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px}
.nav a:hover{background:rgb(var(--surface2));color:rgb(var(--fg))}
.nav a.on{background:rgb(var(--brand)/.12);color:rgb(var(--fg));box-shadow:inset 0 0 0 1px rgb(var(--brand)/.3)}
.nav a.on svg{color:rgb(var(--brand))}
.nav svg,.ic{width:18px;height:18px;flex:none}
.badge-dot{margin-left:auto;background:rgb(var(--danger));color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:600}
.bottom{display:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:rgb(var(--muted));font-size:13.5px}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,rgb(var(--brand)),rgb(var(--brand2)));box-shadow:0 8px 24px -8px rgb(var(--brand)/.7);flex:none}
.card{background:rgb(var(--surface)/.82);border:1px solid rgb(var(--border)/.75);border-radius:18px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 1px 0 rgb(255 255 255/.04) inset,0 10px 30px -18px rgb(0 0 0/.5);min-width:0}
.ct{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ct h3{margin:0;font-size:15px}.ct p{margin:1px 0 0;font-size:12px;color:rgb(var(--muted))}.ct .r{margin-left:auto}
.ct .i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgb(var(--brand)/.12);color:rgb(var(--brand))}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:12px;border:0;font-size:13.5px;font-weight:600;white-space:nowrap;background:linear-gradient(135deg,rgb(var(--brand)),rgb(var(--brand2)));color:#fff;box-shadow:0 6px 18px -8px rgb(var(--brand)/.8)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.s{background:rgb(var(--surface2));color:rgb(var(--fg));box-shadow:none;border:1px solid rgb(var(--border))}
.btn.g{background:none;color:rgb(var(--muted));box-shadow:none}.btn.g:hover{background:rgb(var(--surface2));color:rgb(var(--fg))}
.btn.d{background:rgb(var(--danger));box-shadow:none}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:10px}
.inp,select,textarea{width:100%;border-radius:12px;border:1px solid rgb(var(--border));background:rgb(var(--surface2)/.6);color:rgb(var(--fg));padding:10px 13px;font-size:14px;outline:none}
.inp:focus,select:focus,textarea:focus{border-color:rgb(var(--brand)/.6);box-shadow:0 0 0 3px rgb(var(--brand)/.15)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgb(var(--muted));margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;border:1px solid rgb(var(--border));background:rgb(var(--surface2)/.7);padding:2px 9px;font-size:11.5px;color:rgb(var(--muted))}
.tag{display:inline-flex;align-items:center;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;border:1px solid}
.t-brand{color:rgb(var(--brand));border-color:rgb(var(--brand)/.3);background:rgb(var(--brand)/.1)}.t-ok{color:rgb(var(--ok));border-color:rgb(var(--ok)/.3);background:rgb(var(--ok)/.1)}.t-warn{color:rgb(var(--warn));border-color:rgb(var(--warn)/.3);background:rgb(var(--warn)/.1)}.t-danger{color:rgb(var(--danger));border-color:rgb(var(--danger)/.3);background:rgb(var(--danger)/.1)}.t-m{color:rgb(var(--math));border-color:rgb(var(--math)/.3);background:rgb(var(--math)/.1)}.t-p{color:rgb(var(--phys));border-color:rgb(var(--phys)/.3);background:rgb(var(--phys)/.1)}.t-c{color:rgb(var(--chem));border-color:rgb(var(--chem)/.3);background:rgb(var(--chem)/.1)}
.tabs{display:inline-flex;gap:3px;padding:3px;border-radius:12px;border:1px solid rgb(var(--border));background:rgb(var(--surface2)/.5);overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:rgb(var(--muted));white-space:nowrap}
.tabs button.on{background:rgb(var(--surface));color:rgb(var(--fg));box-shadow:0 1px 4px rgb(0 0 0/.2)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;border:1px solid rgb(var(--border)/.6);background:rgb(var(--surface2)/.4);margin-bottom:8px}
.item.over{border-color:rgb(var(--danger)/.4);background:rgb(var(--danger)/.06)}
.item .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .s{font-size:12px;color:rgb(var(--muted))}
.muted{color:rgb(var(--muted))}.subtle{color:rgb(var(--subtle))}.small{font-size:12.5px}.xs{font-size:11px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:8px;border-radius:99px;background:rgb(var(--surface2));overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgb(var(--brand)),rgb(var(--brand2)));transition:width .6s}
.empty{border:1px dashed rgb(var(--border));border-radius:16px;padding:28px 18px;text-align:center;color:rgb(var(--muted));font-size:13.5px}
.empty b{display:block;color:rgb(var(--fg));margin-bottom:4px}
.iconbtn{border:0;background:none;padding:6px;border-radius:8px;color:rgb(var(--muted))}.iconbtn:hover{background:rgb(var(--surface2));color:rgb(var(--fg))}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;font-size:12px;font-weight:500;color:rgb(var(--muted));text-align:center}
.qa span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgb(var(--brand)/.12);color:rgb(var(--brand))}
.qa:hover{color:rgb(var(--fg));border-color:rgb(var(--brand)/.4)}
.hero{position:relative;overflow:hidden;padding:24px}
.hero:before{content:"";position:absolute;right:-80px;top:-100px;width:300px;height:300px;border-radius:50%;background:rgb(var(--brand)/.22);filter:blur(60px)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,rgb(var(--brand)),rgb(var(--brand2)));flex:none}
.search{position:relative;margin-top:18px}.search input{height:54px;border-radius:16px;padding:0 110px 0 46px;font-size:15px;box-shadow:0 0 0 1px rgb(var(--brand)/.3),0 8px 30px -10px rgb(var(--brand)/.5)}
.search svg{position:absolute;left:15px;top:17px;color:rgb(var(--brand))}.search .btn{position:absolute;right:7px;top:8px}
.drop{position:absolute;left:0;right:0;top:62px;z-index:10;padding:6px}
.drop a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;color:rgb(var(--fg));text-decoration:none;font-size:13.5px}.drop a:hover{background:rgb(var(--surface2))}
.ring{position:relative;display:inline-grid;place-items:center}.ring b{position:absolute;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0/.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto}.modal.wide{max-width:820px}
.modal h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center}.modal h2 .iconbtn{margin-left:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast div{background:rgb(var(--surface));border:1px solid rgb(var(--border));padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px -10px rgb(0 0 0/.6);pointer-events:auto}
.toast .e{border-color:rgb(var(--danger)/.5)}
.note{border-radius:12px;padding:10px 13px;font-size:13px;border:1px solid}
.note.w{color:rgb(var(--warn));border-color:rgb(var(--warn)/.35);background:rgb(var(--warn)/.08)}.note.i{color:rgb(var(--brand));border-color:rgb(var(--brand)/.3);background:rgb(var(--brand)/.07)}
/* markdown */
.md{font-size:14.5px;line-height:1.7}.md p{margin:.5em 0}.md h1,.md h2,.md h3{margin:1em 0 .3em;font-size:1.05em}.md ul,.md ol{padding-left:1.3em;margin:.4em 0}.md code{background:rgb(var(--surface2));padding:1px 5px;border-radius:5px;font-size:.9em}.md table{border-collapse:collapse;margin:.5em 0}.md td,.md th{border:1px solid rgb(var(--border));padding:4px 8px}.md mjx-container[display=true]{overflow-x:auto;overflow-y:hidden}
.notebook{--l:30px;border-radius:16px;padding:20px 20px 20px 54px;background:#fdfcf7;color:#1c2140;line-height:var(--l);background-image:linear-gradient(90deg,transparent 38px,rgb(232 90 110/.55) 38px,rgb(232 90 110/.55) 40px,transparent 40px),repeating-linear-gradient(transparent,transparent calc(var(--l) - 1px),rgb(110 140 200/.3) calc(var(--l) - 1px),rgb(110 140 200/.3) var(--l))}
.notebook .md{line-height:var(--l)}.notebook .md p,.notebook .md li{margin:0}.notebook .md h3{color:#3a2fb8;margin:var(--l) 0 0;line-height:var(--l)}.notebook .md h3:first-child{margin-top:0}
/* chat */
.chat{display:flex;height:calc(100vh - 140px);gap:16px}.convs{width:240px;flex:none;overflow:auto}.pane{flex:1;min-width:0;display:flex;flex-direction:column;padding:0}
.msgs{flex:1;overflow:auto;padding:20px}.bub{max-width:80%;margin-left:auto;background:linear-gradient(135deg,rgb(var(--brand)),rgb(var(--brand2)));color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;white-space:pre-wrap}
.amsg{display:flex;gap:10px;margin:14px 0}.amsg .md{flex:1;min-width:0}
.composer{border-top:1px solid rgb(var(--border)/.7);padding:12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:160px}
.imgprev{display:flex;align-items:center;gap:10px;padding:8px 12px 0}.imgprev img{height:64px;border-radius:10px;border:1px solid rgb(var(--border))}
.msgimg{display:block;max-width:220px;max-height:220px;border-radius:12px;margin:0 0 6px auto;border:1px solid rgb(255 255 255/.25)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:rgb(var(--brand));animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
/* flip */
.flip{perspective:1400px;cursor:pointer}.flip .in{position:relative;min-height:260px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.flip .bk{transform:rotateY(180deg)}
.pt{display:grid;grid-template-columns:repeat(18,minmax(30px,1fr));gap:3px;min-width:640px}.pt button{aspect-ratio:1;border-radius:5px;border:1px solid rgb(var(--border));background:rgb(var(--surface2));padding:1px;font-size:11px;font-weight:700;line-height:1.1}.pt button small{display:block;font-size:7px;font-weight:400;color:rgb(var(--muted))}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal button{min-height:58px;border-radius:10px;border:1px solid rgb(var(--border)/.5);background:none;text-align:left;padding:5px;font-size:11px;vertical-align:top}.cal button.sel{border-color:rgb(var(--brand));background:rgb(var(--brand)/.1)}.cal .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;background:rgb(var(--brand))}
.switch{width:42px;height:24px;border-radius:99px;border:0;position:relative;background:rgb(var(--surface2));box-shadow:inset 0 0 0 1px rgb(var(--border))}.switch.on{background:rgb(var(--brand))}.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.switch.on i{left:20px}
.mic{width:76px;height:76px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,rgb(var(--brand)),rgb(var(--brand2)));display:grid;place-items:center;margin:6px auto}.mic.live{background:rgb(var(--danger));animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(var(--danger)/.5)}100%{box-shadow:0 0 0 22px rgb(var(--danger)/0)}}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{display:none}.main{margin-left:0;padding:14px 14px 90px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgb(var(--surface)/.92);backdrop-filter:blur(18px);border-top:1px solid rgb(var(--border));padding-bottom:env(safe-area-inset-bottom)}
  .bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:10.5px;color:rgb(var(--muted));text-decoration:none;border:0;background:none;font-weight:500}.bottom .on{color:rgb(var(--brand))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}.top h1{font-size:20px}
  .chat{height:calc(100vh - 170px)}.top{flex-wrap:wrap}.top .acts{margin-left:0;width:100%}.qa{padding:10px 4px}.convs{display:none}.bub{max-width:90%}
}
.diagram{margin:10px 0;text-align:center}.diagram img{max-width:100%;background:#fff;border-radius:12px;border:1px solid rgb(var(--border))}.diagram figcaption{font-size:11px;color:rgb(var(--subtle));margin-top:4px}
body.focusmode .side,body.focusmode .bottom{display:none!important}body.focusmode .main{margin-left:0;max-width:900px;margin:0 auto}
@media print{.side,.bottom,.noprint{display:none!important}.main{margin:0}}
</style>
</head>

async function save(coll, obj) {
  obj = { ...obj, updatedAt: new Date().toISOString() };
  if (coll === "convs" && obj.messages) obj.messages = obj.messages.slice(-60).map(({ pending, ...m }) => m); // stay well under the 256 KiB document limit
  if (!obj.id) obj.id = uid();
  if (!obj.createdAt) obj.createdAt = obj.updatedAt;
  const list = state[coll]; const i = list.findIndex((x) => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.push(obj);
  if (state.cloud) {

    catch (e) { toast(e.code === "quota_exceeded" ? "Storage is full — delete some old items." : "Not saved: " + (e.message || e.code), true); throw e; }
  } else local.set(coll, list);

}
async function remove(coll, id) {

  if (state.cloud) { try { await PROFILE_REF.collection(coll).doc(id).delete(); } catch (e) { toast("Not deleted: " + (e.message || e.code), true); } }

  const ta = $("#vtext"); let base = "";
  if (state.dict) {
    const d = state.dict;
    d.onPartial?.(({ text }) => { ta.value = (base ? base + " " : "") + text; });
    d.onFinal?.(({ text }) => { base = (base ? base + " " : "") + text; ta.value = base; });
    d.onState?.(({ state: s, reason }) => { const b = $("#micb"), l = $("#mics"); if (!b) return; dictOn = s === "listening"; b.classList.toggle("live", dictOn); l.textContent = dictOn ? "Listening… tap to stop" : reason === "not_granted" ? "Microphone not allowed — type instead." : "Tap to speak"; });
    $("#micb").onclick = () => { if (dictOn) { d.stop().catch(() => {}); return; } base = ta.value.trim(); d.start().catch((e) => { $("#mics").textContent = e.code === "not_granted" ? "Voice not allowed — please type instead." : "Couldn't start the microphone — type instead."; }); };
  }

    } catch (e) { toast(e.message + " — fill in the details yourself.", true); s = { kind: "memory", title: text.slice(0, 80), content: text, category: "General Notes", priority: "medium" }; }
    reviewItem(s, text);
  };

// ---------- periodic table
function periodicTable() {
  const els = PT_RAW.split("|").map((r) => { const [z, sym, name, mass, g, p, cat] = r.split(","); return { z: +z, sym, name, mass, g: g ? +g : null, p: +p, cat }; });
  const col = { am: "#f43f5e", ae: "#f97316", tm: "#f59e0b", pt: "#14b8a6", md: "#84cc16", nm: "#0ea5e9", hg: "#06b6d4", ng: "#8b5cf6", ln: "#ec4899", ac: "#d946ef" };
  const names = { am: "Alkali metal", ae: "Alkaline earth", tm: "Transition metal", pt: "Post-transition", md: "Metalloid", nm: "Non-metal", hg: "Halogen", ng: "Noble gas", ln: "Lanthanide", ac: "Actinide" };
  const sel = els.find((e) => e.z === (ui.el || 26));
  const pos = (e) => (e.cat === "ln" && e.z <= 71 ? [9, e.z - 54] : e.cat === "ac" && e.z <= 103 ? [10, e.z - 86] : [e.p, e.g]);
  return `<div class="card"><div class="row" style="margin-bottom:12px"><div style="width:74px;height:74px;border-radius:16px;display:grid;place-items:center;text-align:center;border:2px solid ${col[sel.cat]}"><div><div class="xs muted">${sel.z}</div><b style="font-size:26px">${sel.sym}</b></div></div><div class="grid g4 grow small" style="gap:6px"><div><div class="xs subtle">NAME</div>${sel.name}</div><div><div class="xs subtle">ATOMIC MASS</div>${sel.mass} u</div><div><div class="xs subtle">GROUP / PERIOD</div>${sel.g ?? "—"} / ${sel.p}</div><div><div class="xs subtle">CATEGORY</div>${names[sel.cat]}</div></div></div>
  <div style="overflow-x:auto"><div class="pt">${els.map((e) => { const [r, c] = pos(e); return `<button data-a="el" data-z="${e.z}" style="grid-row:${r};grid-column:${c};border-color:${col[e.cat]}66;background:${col[e.cat]}1f;${e.z === sel.z ? "outline:2px solid rgb(var(--brand))" : ""}" title="${e.name}"><small>${e.z}</small>${e.sym}</button>`; }).join("")}<div style="grid-row:8;grid-column:1/19;height:6px"></div></div></div>
  <div class="row wrap" style="gap:5px;margin-top:10px">${Object.entries(names).map(([k, v]) => `<span class="chip" style="border-color:${col[k]}66">${v}</span>`).join("")}</div><p class="xs subtle">IUPAC standard atomic weights (rounded); [ ] = mass number of the most stable isotope.</p></div>`;
}

function srs(c, r) {
  let { ease = 2.5, interval = 0, reps = 0, lapses = 0 } = c, due;
  if (r === 0) { lapses++; reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2); due = Date.now() + 600000; }
  else { const q = [0, 3, 4, 5][r]; ease = Math.max(1.3, ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))); reps++; interval = reps === 1 ? (r === 3 ? 3 : 1) : reps === 2 ? (r === 1 ? 3 : 6) : Math.round(interval * (r === 1 ? 1.2 : r === 3 ? ease * 1.3 : ease)); interval = Math.min(interval, 365); due = Date.now() + interval * 864e5; }
  const st = reps === 0 ? "learning" : interval >= 21 ? "mastered" : interval >= 3 ? "review" : "learning";
  return { ease: Math.round(ease * 100) / 100, interval, reps, lapses, state: st, due: new Date(due).toISOString(), reviewedAt: new Date().toISOString(), reviews: [...(c.reviews || []).slice(-30), { r, at: new Date().toISOString() }] };
}

// ============================================================ diagrams: AI answers may include ```svg blocks, shown as safe images
const DIAGRAM_RULE = `DIAGRAMS: when a figure genuinely helps (physics set-ups, free-body or ray diagrams, circuits, graphs, geometry, molecular structures), include ONE clean diagram as a fenced \`\`\`svg code block: a complete <svg> with viewBox and width at most 480, white background rectangle, dark strokes, clear labels with units, no scripts, no external images or fonts. Keep it simple and correct; skip it for questions that don't need a figure.`;
const FIGS = [];
const IMAGE_RULE = `IMAGE REQUEST: the user wants you to CREATE an image. Draw it yourself as ONE high-quality SVG illustration in a fenced \`\`\`svg code block (this is how you make images here — never say you cannot make images). Requirements: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800">, a full background rectangle, rich but tasteful colours (linear/radial gradients welcome), clean shapes, clear readable labels (font-family="Arial, sans-serif", font-size 16-28) and a title at the top when it suits; for educational diagrams be scientifically correct (correct parts, arrows, units, label lines). No scripts, no external images, no web fonts, no <foreignObject>. After the code block, write 1-2 short sentences describing the image. If the request is for a real person's photo or something unsafe, politely decline.`;
async function saveFigure(k) {
  const src = FIGS[+k]; if (!src) return;
  const dl = await (window.claude?.use ? window.claude.use("downloads").catch(() => null) : null);
  if (!dl) { try { await navigator.clipboard.writeText(src); toast("Saving files isn't available here — the image's SVG code was copied instead."); } catch (_) { toast("Saving isn't available in this view. Take a screenshot instead.", true); } return; }
  let blob = null, name = "memora-image-" + dayKey(new Date()) + ".png";
  try { // render the SVG to a PNG that opens anywhere (gallery, WhatsApp)
    const img = new Image(); img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(src)));
    await img.decode();
    const w = img.naturalWidth || 800, h = img.naturalHeight || 600, sc = Math.min(3, 2400 / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise((r) => c.toBlob(r, "image/png"));
  } catch (_) { blob = null; }
  if (!blob) { blob = new Blob([src], { type: "image/svg+xml" }); name = name.replace(".png", ".svg"); }
  try { await dl.save({ filename: name, data: blob }); toast("Image saved."); }
  catch (e) { if (e.code !== "declined") toast(e.code === "rate_limited" ? "Please wait a moment and try again." : "Couldn't save the image here.", true); }
}
function svgToImg(code) {
  let s = String(code).trim();
  const a = s.indexOf("<svg"), b = s.lastIndexOf("</svg>");
  if (a < 0 || b < 0) return "";
  s = s.slice(a, b + 6)
    .replace(/<script[\s\S]*?<\/script>/gi, "").replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, "")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, "").replace(/(href|xlink:href)\s*=\s*("(?!#)[^"]*"|'(?!#)[^']*')/gi, "");
  if (!/xmlns=/.test(s)) s = s.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
  try { const k = FIGS.push(s) - 1; return `<figure class="diagram"><img alt="AI-drawn image" src="data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(s)))}"><figcaption>✦ AI-drawn image — check labels against your textbook <button class="btn s sm" style="margin-left:6px" data-a="saveimg" data-k="${k}">${svg("download", 13)}Save image</button></figcaption></figure>`; } catch (_) { return ""; }
}

async function recordQuizMistakes(q, r) {
  let n = 0;
  for (const [i, x] of q.questions.entries()) {
    if (r.answers[i] === x.answer) continue;
    try { await save("mistakes", { question: x.question, yours: r.answers[i] === null ? "(not answered)" : `${"ABCD"[r.answers[i]]}. ${x.options[r.answers[i]]}`, correct: `${"ABCD"[x.answer]}. ${x.options[x.answer]}`, explanation: x.explanation, topic: x.topic || "General", subject: q.subject, source: "Quiz: " + q.title, resolved: false }); n++; } catch (_) { break; }
  }
  return n;
}

// ============================================================ 13. Weak Topic Detector
function weakTopics() {
  const t = {};
  const get = (name, subject) => (t[name.toLowerCase()] ||= { name, subject, attempts: 0, correct: 0, mistakes: 0, lapses: 0, reasons: [] });
  state.quizzes.forEach((q) => (q.attempts || []).forEach((a) => Object.entries(a.topics || {}).forEach(([k, v]) => { const x = get(k, q.subject); x.attempts += v.n; x.correct += v.c; })));
  state.mistakes.filter((m) => !m.resolved).forEach((m) => { get(m.topic || "General", m.subject).mistakes++; });
  state.flashcards.filter((c) => (c.lapses || 0) >= 2).forEach((c) => { get(c.deck || "General", c.subject).lapses += c.lapses; });
  return Object.values(t).map((x) => {
    const acc = x.attempts ? x.correct / x.attempts : null;
    let score = 0;
    if (acc !== null && x.attempts >= 2) { score += (1 - acc) * 60; if (acc < 0.6) x.reasons.push(`quiz accuracy ${Math.round(acc * 100)}% (${x.correct}/${x.attempts})`); }
    if (x.mistakes) { score += Math.min(30, x.mistakes * 8); x.reasons.push(`${x.mistakes} open mistake${x.mistakes > 1 ? "s" : ""}`); }
    if (x.lapses) { score += Math.min(20, x.lapses * 4); x.reasons.push(`flashcards forgotten ${x.lapses} times`); }
    return { ...x, acc, score: Math.round(score) };
  }).filter((x) => x.reasons.length).sort((a, b) => b.score - a.score);
}

const room = { mode: "focus", left: 25 * 60, running: false, focusMin: 25, breakMin: 5, done: 0, subject: "", goal: "", iv: null, startedAt: null, focusSec: 0 };
PAGES.studyroom = () => {

  return `<div class="studyroom"><div class="row" style="margin-bottom:10px"><b class="grow">Study Room</b><button class="btn g sm" data-a="srfull">Full screen</button><a class="btn s sm" href="#dashboard" style="text-decoration:none" data-a="srexit">Leave room</a></div>

  <div class="xs" style="letter-spacing:.2em;font-weight:700;color:${r.mode === "focus" ? "rgb(var(--brand))" : "rgb(var(--ok))"}">${r.mode === "focus" ? "FOCUS" : "BREAK — STAND UP, DRINK WATER"}</div>
  <div style="position:relative;width:260px;height:260px;margin:14px auto">${ring(100 - (r.left / total) * 100, 260, r.mode === "focus" ? "rgb(var(--brand))" : "rgb(var(--ok))").replace(/<b>.*?<\/b>/, "")}<div id="srclock" style="position:absolute;inset:0;display:grid;place-items:center;font:600 54px ui-monospace,monospace">${m}:${String(s).padStart(2, "0")}</div></div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="srgo" style="min-width:120px">${r.running ? "Pause" : r.left < total ? "Resume" : "Start"}</button><button class="btn s" data-a="srreset">Reset</button>${r.mode === "break" ? `<button class="btn g" data-a="srskip">Skip break</button>` : ""}</div>
  <div class="grid g2" style="max-width:520px;margin:20px auto 0;gap:10px;text-align:left"><label class="f"><span>Subject</span><select id="srsub" ${r.running ? "disabled" : ""}><option value="">General</option>${Object.entries(SUBJ).map(([k, v]) => `<option value="${k}" ${r.subject === k ? "selected" : ""}>${v.n}</option>`).join("")}</select></label><label class="f"><span>This session's goal</span><input class="inp te" id="srgoal" value="${esc(r.goal)}" placeholder="Finish 10 numericals"></label></div>
  <p class="small muted">${r.done} focus session${r.done === 1 ? "" : "s"} completed in this visit · each finished focus block is logged to your progress & streak.</p></div></div>`;
};
PAGES.studyroom.after = () => {
  document.body.classList.add("focusmode");
  $("#srp").onclick = (e) => { const b = e.target.closest("[data-f]"); if (!b || room.running) return; room.focusMin = +b.dataset.f; room.breakMin = +b.dataset.b; room.mode = "focus"; room.left = room.focusMin * 60; render(); };
  $("#srsub").onchange = (e) => (room.subject = e.target.value); $("#srgoal").oninput = (e) => (room.goal = e.target.value);
};
async function roomTick() {
  room.left--; if (room.mode === "focus") room.focusSec++;
  const el = $("#srclock"); if (el) el.textContent = `${Math.floor(room.left / 60)}:${String(room.left % 60).padStart(2, "0")}`;
  if (room.left > 0) return;
  clearInterval(room.iv); room.running = false;
  if (room.mode === "focus") {
    room.done++; const minutes = Math.round(room.focusSec / 60); room.focusSec = 0;
    try { await save("logs", { minutes: Math.max(1, minutes), subject: room.subject || null, note: room.goal || "Study Room focus block", at: room.startedAt || new Date().toISOString() }); } catch (_) {}
    toast(`Focus block done — ${minutes} min logged. Take a ${room.breakMin}-minute break.`);
    room.mode = "break"; room.left = room.breakMin * 60;
  } else { room.mode = "focus"; room.left = room.focusMin * 60; toast("Break over — ready for the next focus block?"); }
  room.startedAt = null;
  if (route().page === "studyroom") render();
}
function roomToggle() {
  if (room.running) { clearInterval(room.iv); room.running = false; }
  else { room.running = true; room.startedAt ||= new Date().toISOString(); room.iv = setInterval(roomTick, 1000); }
  render();
}
async function roomStopLog() { // leaving mid-block: log the minutes actually studied
  if (room.mode === "focus" && room.focusSec >= 120) { try { await save("logs", { minutes: Math.round(room.focusSec / 60), subject: room.subject || null, note: room.goal || "Study Room (partial)", at: room.startedAt || new Date().toISOString() }); toast(`${Math.round(room.focusSec / 60)} min logged.`); } catch (_) {} }
  clearInterval(room.iv); room.running = false; room.focusSec = 0; room.startedAt = null; room.mode = "focus"; room.left = room.focusMin * 60;
}

// ============================================================ 19. Learning Streaks
function activeDays() {
  const days = new Map();
  const add = (iso, m = 0) => { if (!iso) return; const k = dayKey(iso); days.set(k, (days.get(k) || 0) + m); };
  state.logs.forEach((l) => add(l.at, l.minutes));
  state.flashcards.forEach((c) => (c.reviews || []).forEach((r) => add(r.at)));
  state.vocab.forEach((w) => (w.reviews || []).forEach((r) => add(r.at)));
  state.quizzes.forEach((q) => (q.attempts || []).forEach((a) => add(a.at)));
  state.tasks.forEach((t) => t.completedAt && add(t.completedAt));
  state.progress.forEach((p) => p.completedAt && add(p.completedAt));
  return days;
}
function streaks() {
  const d = activeDays(), today = dayKey(new Date());
  let cur = 0, k = d.has(today) ? today : addDays(today, -1);
  while (d.has(k)) { cur++; k = addDays(k, -1); }
  const all = [...d.keys()].sort(); let best = 0, run = 0, prev = null;
  all.forEach((x) => { run = prev && addDays(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; });
  const todayMin = state.logs.filter((l) => dayKey(l.at) === today).reduce((a, l) => a + l.minutes, 0);
  return { cur, best, total: d.size, today: d.has(today), todayMin, days: d };
}
PAGES.streaks = () => {
  const s = streaks(), today = dayKey(new Date()), goal = state.profile.goal || 120;
  const start = addDays(today, -7 * 16 + 1 - ((new Date(today + "T12:00:00Z").getUTCDay() + 6) % 7));
  const cells = [...Array(7 * 17)].map((_, i) => addDays(start, i)).filter((d) => d <= today);
  const lvl = (d) => { const m = state.logs.filter((l) => dayKey(l.at) === d).reduce((a, l) => a + l.minutes, 0); return !s.days.has(d) ? 0 : m >= goal ? 4 : m >= goal / 2 ? 3 : m > 0 ? 2 : 1; };
  return header("trend", "Learning Streaks", "A day counts when you study, review flashcards or words, take a quiz, or complete a task or chapter.") + `
  <div class="grid g4" style="margin-bottom:16px">${[["🔥 Current streak", s.cur + " day" + (s.cur === 1 ? "" : "s")], ["🏆 Best streak", s.best + " days"], ["📅 Active days", s.total], ["⏱ Today", mins(s.todayMin) + " / " + mins(goal)]].map(([l, v]) => `<div class="card"><div class="xs muted">${l}</div><b style="font-size:24px">${v}</b></div>`).join("")}</div>
  ${!s.today ? `<div class="note w small" style="margin-bottom:14px">${s.cur ? `Study today to keep your ${s.cur}-day streak alive!` : "Start a new streak today — even 15 focused minutes count."} <a href="#studyroom">Open Study Room →</a></div>` : `<div class="note i small" style="margin-bottom:14px">Today counts ✔ Keep going!</div>`}
  <div class="card"><div class="ct"><h3>Last 16 weeks</h3></div><div style="overflow-x:auto"><div style="display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px">${cells.map((d) => `<i title="${d}" style="border-radius:3px;background:${["rgb(var(--surface2))", "rgb(var(--brand)/.3)", "rgb(var(--brand)/.5)", "rgb(var(--brand)/.75)", "rgb(var(--brand))"][lvl(d)]}"></i>`).join("")}</div></div><div class="row xs muted" style="margin-top:8px;gap:6px">Less ${[0, 1, 2, 3, 4].map((i) => `<i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${["rgb(var(--surface2))", "rgb(var(--brand)/.3)", "rgb(var(--brand)/.5)", "rgb(var(--brand)/.75)", "rgb(var(--brand))"][i]}"></i>`).join("")} More · darkest = daily goal reached</div></div>`;
};

// ============================================================ 20. Achievement Centre
function achievements() {
  const s = streaks(), reviews = state.flashcards.reduce((a, c) => a + (c.reviews || []).length, 0), attempts = state.quizzes.flatMap((q) => q.attempts || []);
  const chDone = state.progress.filter((p) => p.status === "completed").length, mins_ = state.logs.reduce((a, l) => a + l.minutes, 0);
  const perfect = attempts.some((a) => a.total >= 5 && a.score === a.total);
  const list = [
    ["🧠", "First Memory", "Save your first memory", state.memories.length, 1], ["📚", "Memory Keeper", "Save 25 memories", state.memories.length, 25],
    ["🔥", "Getting Started", "3-day learning streak", s.best, 3], ["⚡", "On Fire", "7-day learning streak", s.best, 7], ["🏔", "Unstoppable", "30-day learning streak", s.best, 30],
    ["⏱", "Focused", "Study for 10 hours in total", Math.round(mins_ / 60), 10], ["🕰", "Marathon", "Study for 50 hours in total", Math.round(mins_ / 60), 50],
    ["✅", "Chapter Champ", "Complete 5 chapters", chDone, 5], ["🎓", "Syllabus Slayer", "Complete 25 chapters", chDone, 25],
    ["📝", "Quiz Taker", "Finish 5 practice tests", attempts.length, 5], ["💯", "Perfect Score", "Score 100% on a test with 5+ questions", perfect ? 1 : 0, 1],
    ["🃏", "Card Shark", "Do 100 flashcard reviews", reviews, 100], ["🛠", "Mistake Fixer", "Fix 10 mistakes", state.mistakes.filter((m) => m.resolved).length, 10],
    ["📖", "Word Collector", "Save 25 vocabulary words", state.vocab.length, 25], ["🗂", "Paper Collector", "Add 5 previous papers", state.papers.length, 5],
    ["🧪", "Formula Master", "Add 10 formulas to your vault", state.formulas.length, 10],
  ];
  return list.map(([icon, name, desc, have, need]) => ({ icon, name, desc, have: Math.min(have, need), need, done: have >= need }));
}

    case "vdel": confirmBox("Remove this lesson and its notes?", async () => { await remove("videos", route().arg); go("youtube"); }); break;
    case "vndel": { const v = state.videos.find((x) => x.id === route().arg); await save("videos", { ...v, notes: v.notes.filter((_, i) => i !== +el.dataset.i) }); render(); break; }
    case "vpl": { const v = state.videos.find((x) => x.id === route().arg); modal("Add to playlist", `<form id="plf"><input class="inp" id="pli" list="pll" placeholder="Playlist name, e.g. Electrostatics revision" required><datalist id="pll">${[...new Set(state.videos.flatMap((x) => x.playlists || []))].map((p) => `<option value="${esc(p)}">`).join("")}</datalist><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn">Add</button></div></form>`); $("#plf").onsubmit = async (ev) => { ev.preventDefault(); const p = $("#pli").value.trim(); await save("videos", { ...v, playlists: [...new Set([...(v.playlists || []), p])] }); closeModal(); toast("Added to " + p + "."); render(); }; break; }
    case "vcards": { const v = state.videos.find((x) => x.id === route().arg); flashGen({ source: "text", text: (v.notes || []).map((n) => n.c).join("\n"), deck: v.title.slice(0, 80), subject: v.subject, count: 8, from: "video" }); break; }
    // flashcards
    case "fnew": cardEditor(); break;
    case "fedit": cardEditor(state.flashcards.find((c) => c.id === id)); break;
    case "fdel": confirmBox("Delete this flashcard?", async () => { await remove("flashcards", id); render(); }); break;
    case "fgen": flashGenPicker(); break;
    case "fstate": ui.ff = { ...(ui.ff || { deck: "all" }), state: el.dataset.s }; render(); break;
    case "fstart": case "fstudy": { const now = Date.now(), cards = state.flashcards; const q = a === "fstart" ? [...cards.filter((c) => new Date(c.due || 0) <= now && (c.state || "new") !== "new").sort((x, y) => hard(y) - hard(x)), ...cards.filter((c) => (c.state || "new") === "new").slice(0, 10)] : cards.filter((c) => (ui.ff.deck === "all" || c.deck === ui.ff.deck)); ui.session = { queue: q, i: 0, flip: false, done: 0, again: 0 }; render(); break; }
    case "fflip": ui.session.flip = !ui.session.flip; $(".flip")?.classList.toggle("on", ui.session.flip); const rb = $(".grid.g4"); if (rb) { rb.style.opacity = ui.session.flip ? 1 : 0.35; rb.style.pointerEvents = ui.session.flip ? "" : "none"; } break;
    case "frate": { const s = ui.session, c = s.queue[s.i], r = +el.dataset.r; try { const upd = { ...c, ...srs(c, r) }; await save("flashcards", upd); s.done++; if (r === 0) { s.again++; s.queue.push(upd); } s.i++; s.flip = false; render(); } catch (_) {} break; }
    case "fexit": ui.session = null; render(); break;
    // quizzes
    case "qdel": confirmBox("Delete this quiz and its results?", async () => { await remove("quizzes", id); render(); }); break;
    case "qstart": { const q = state.quizzes.find((x) => x.id === route().arg); ui.qt = { i: 0, ans: Array(q.questions.length).fill(null), mark: Array(q.questions.length).fill(false), start: Date.now() }; render(); break; }
    case "qans": { const i = +el.dataset.i; ui.qt.ans[ui.qt.i] = ui.qt.ans[ui.qt.i] === i ? null : i; ui.qt.confirm = 0; render(); break; }
    case "qmark": ui.qt.mark[ui.qt.i] = !ui.qt.mark[ui.qt.i]; render(); break;
    case "qprev": ui.qt.i--; render(); break;
    case "qnext": ui.qt.i++; render(); break;
    case "qgo": ui.qt.i = +el.dataset.i; render(); break;
    case "qsubmit": submitQuiz(state.quizzes.find((x) => x.id === route().arg)); break;
    // notifications
    case "nread": { const k = el.dataset.k; state.profile.readNotifs = [...new Set([...(state.profile.readNotifs || []), k])].slice(-300); saveProfile(); break; }
    case "nreadall": state.profile.readNotifs = [...new Set([...(state.profile.readNotifs || []), ...notifications().map((x) => x.key)])].slice(-300); await saveProfile(); render(); break;
    // settings
    case "export": { const data = { exportedAt: new Date().toISOString(), profile: state.profile }; COLLS.forEach((c) => (data[c] = state[c])); try { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); toast("All your data was copied as JSON — paste it into a file to keep a backup."); } catch (_) { modal("Your data (JSON)", `<p class="xs muted">Select all and copy:</p><textarea style="min-height:50vh;font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(data, null, 2))}</textarea>`, true); } break; }
    case "wipe": confirmBox("This permanently deletes ALL your memories, chats, notes, tasks, flashcards, quizzes and videos.", async () => { for (const c of COLLS) for (const x of [...state[c]]) await remove(c, x.id); toast("All your data has been deleted."); render(); }, "Delete everything"); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modal").innerHTML) closeModal();
  if (ui.session && !$("#modal").innerHTML) { if (e.key === " ") { e.preventDefault(); $(".flip")?.click(); } if (ui.session.flip && "1234".includes(e.key) && e.key.length === 1) $(`[data-a="frate"][data-r="${+e.key - 1}"]`)?.click(); }
});
init();
</script>
</body>
</html>
